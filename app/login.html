<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CarePhysio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
        }

        .container {
            min-height: calc(100vh - 40px);
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px 36px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
        }

        .login-card h1 {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 4px;
        }

        .login-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: #94a3b8;
            display: flex;
            align-items: center;
        }

        .toggle-password:hover {
            color: #475569;
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
        }

        .login-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-error {
            display: none;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .login-hint {
            margin-top: 18px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }

        .login-footer {
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            max-width: 380px;
            width: 100%;
            margin: 24px auto 0;
            padding: 0;
        }

        .login-footer p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-wrapper">
            <div class="login-card">
                <h1>AI Call Assistant</h1>
                <p>Sign In</p>

                <div class="login-error" id="login-error">Invalid username or password.</div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
                                <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="login-btn">Sign In</button>
                </form>
            </div>
        </div>

        <footer class="footer login-footer">
            <p>&copy; 2026 Youngsoft Inc Powered By Youngsoft Inc.</p>
        </footer>
    </div>
    <script src="auth.js"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');

        const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        const EYE_CLOSED = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

        toggleBtn.addEventListener('click', () => {
            const showing = passwordInput.type === 'text';
            passwordInput.type = showing ? 'password' : 'text';
            eyeIcon.innerHTML = showing ? EYE_OPEN : EYE_CLOSED;
            toggleBtn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('login-error');

            if (login(username, password)) {
                window.location.href = 'index.html';
            } else {
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
