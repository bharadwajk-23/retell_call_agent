<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePhysio - AI Call Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div>
                    <h1 class="clinic-name">Medicare Clinic</h1>
                    <h2 class="assistant-title">AI Call Assistant</h2>
                </div>
                <div class="header-actions">
                    <!-- <span class="logged-in-user" id="logged-in-user"></span> -->
                    <button class="reset-btn" onclick="resetDemo()">Reset</button>
                    <button class="reset-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="card patient-section">
                <h3 class="section-title">Patient Details</h3>
                <div class="table-container">
                    <table class="patient-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>DOB</th>
                                <th>Missed days</th>
                                <th>Provider</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="patient-table-body"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Youngsoft Inc Powered By Youngsoft Inc</p>
        </footer>
    </div>

    <script src="auth.js"></script>
    <script>
        requireAuth();
        document.getElementById('logged-in-user').textContent = sessionStorage.getItem('username') || '';
    </script>
    <script src="app.js"></script>
</body>
</html>
