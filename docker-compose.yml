services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8005}
    ports:
      - "${BACKEND_PORT:-8006}:8006"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8006}
    ports:
      - "${FRONTEND_PORT:-8005}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
